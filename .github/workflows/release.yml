# Tag vX.Y.Z → a *draft* GitHub Release with the Windows files (reviewed by hand before Publish):
#   Omniweave_X.Y.Z_x64-setup.exe     installer (per user, no admin) — updates itself (signed latest.json)
#   Omniweave_X.Y.Z_x64-portable.exe  no install — updates itself too: swaps in the new portable exe (src-tauri/src/portable.rs)
#   SHA256SUMS.txt, latest.json (+ .sig files): the auto-update manifest read by installed and portable apps
#     latest.json "platforms" = the installer (Tauri updater); "portable"."windows-x86_64" = url, size, sha256 and
#     minisign signature of the portable exe (added below, after the exe is uploaded; docs/UPDATES.md §4)
#
# macOS and Linux are left out until they have been run on real machines (docs/PLATFORMS.md); the matrix entries are
# kept below, commented, to switch them on later.
#
# Repository secrets (Settings › Secrets and variables › Actions — docs/GITHUB_PUBLISH_GUIDE.md):
#   TAURI_SIGNING_PRIVATE_KEY           the updater key file's whole text (its public key is in tauri.conf.json); also
#                                       signs the portable exe
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  that key's password
#   OMW_SIGN_* (optional)               Windows code signing (scripts/sign-windows.ps1); unset = unsigned build
#
# The source tree here is the public one (scripts/make-public-tree.mjs): no qa/ folder, so the tests that read the
# private QA material are skipped by vitest.config.mjs and `npm test` runs the rest.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          # - platform: macos-latest            # after a real-Mac check (signing + notarisation)
          #   args: --target universal-apple-darwin --bundles dmg
          # - platform: ubuntu-22.04            # after a real-Linux check
          #   args: --bundles appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "./src-tauri -> target" }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Keep build-machine paths out of the exe
        shell: pwsh
        run: |
          # panic locations name source files: map the cargo home, rustup home and checkout to fixed words
          $cargo = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
          $rustup = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $HOME ".rustup" }
          $flags = @("--remap-path-prefix=$cargo=/cargo", "--remap-path-prefix=$rustup=/rustup", "--remap-path-prefix=$PWD=/omniweave") -join [char]0x1f
          "CARGO_ENCODED_RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OMW_SIGN_MODE: ${{ secrets.OMW_SIGN_MODE }}
          OMW_SIGN_THUMBPRINT: ${{ secrets.OMW_SIGN_THUMBPRINT }}
          OMW_SIGN_DLIB: ${{ secrets.OMW_SIGN_DLIB }}
          OMW_SIGN_METADATA: ${{ secrets.OMW_SIGN_METADATA }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: "Omniweave ${{ github.ref_name }}"
          releaseBody: "바뀐 점은 CHANGELOG.md를 보세요. Windows 10(2004 이상)·11 x64. 설치본과 포터블 exe 모두 새 버전을 알리고, 누르면 스스로 업데이트합니다. 코드 서명 전이라 처음 실행할 때 '알 수 없는 게시자' 경고가 뜰 수 있습니다(README의 '다운로드·설치')."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
      - if: matrix.platform == 'windows-latest'
        name: Portable exe + self-test + path check + signed latest.json entry
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $out = "Omniweave_${v}_x64-portable.exe"
          Copy-Item src-tauri/target/release/omniweave.exe $out
          & ./$out --selftest | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($out))
          $n = ([regex]::Matches($text, '[A-Za-z]:\\Users\\')).Count
          if ($n -gt 0) { throw "build-machine user paths in the exe: $n" }
          gh release upload "${{ github.ref_name }}" $out --clobber
          # the portable exe updates itself from this entry (size + sha256 + the updater key's signature): the exe is
          # uploaded first, latest.json last — and the release stays a draft until Publish, so apps see both at once
          npx tauri signer sign $out | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$out.sig")) { throw "signing the portable exe failed" }
          New-Item -ItemType Directory -Force manifest | Out-Null
          gh release download "${{ github.ref_name }}" -p latest.json -D manifest --clobber
          $latest = Get-Content manifest/latest.json -Raw | ConvertFrom-Json
          $entry = [ordered]@{
            url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$out"
            size = (Get-Item $out).Length
            sha256 = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
            signature = (Get-Content "$out.sig" -Raw).Trim()
          }
          $latest | Add-Member -NotePropertyName portable -NotePropertyValue ([ordered]@{ "windows-x86_64" = $entry }) -Force
          [System.IO.File]::WriteAllText("$PWD/manifest/latest.json", ($latest | ConvertTo-Json -Depth 10))
          gh release upload "${{ github.ref_name }}" manifest/latest.json "$out.sig" --clobber
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl && cd dl
          gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" -p "*.exe"
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt -R "${{ github.repository }}" --clobber
