# website/ 폴더(정적 홈페이지)를 GitHub Pages로 배포합니다.
# - main 브랜치에서 website/ 아래 파일이 바뀌면 자동 실행, Actions 탭에서 수동 실행도 가능.
# - 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 바꿔 두세요.
# - 비공개 저장소의 Pages는 GitHub 유료 플랜(Pro/Team/Enterprise)에서만 됩니다.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "public/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check config.json is valid JSON
        run: python3 -m json.tool website/config.json > /dev/null
      - name: Check localized pages are up to date (i18n/*.json → HTML)
        run: node website/build-i18n.mjs --check
      - name: Copy public files only
        run: |
          mkdir _site
          rsync -a --exclude '_templates/' --exclude 'i18n/' --exclude 'build-i18n.mjs' \
                   --exclude 'README.txt' --exclude '.htaccess' website/ _site/
      # browser demo: the real app (web build) served at /app/ — "try it now, no install"
      # Two channels (docs/RELEASING.md §웹판 업데이트): /app/ (release) is built from the pinned commit APP_RELEASE_REF,
      # so a source push does not replace it; /app-beta/ (test) is built from this commit. Replacing the release web
      # app = setting APP_RELEASE_REF to the commit tested at /app-beta/ (only when the release is decided).
      - name: Build the release web app into /app (pinned commit)
        # OMW_WEB=1: manifest, home-screen icons and the offline service worker (scripts/web-pwa.mjs) — web build only
        env:
          OMW_WEB: "1"
          APP_RELEASE_REF: 8e8bcd21efb8f0063f2b4d84ce4b6027044bf637
        run: |
          git fetch --no-tags --depth 1 origin "$APP_RELEASE_REF"
          git worktree add --detach "$RUNNER_TEMP/app-release" "$APP_RELEASE_REF"
          cd "$RUNNER_TEMP/app-release"
          npm ci
          npx vite build --outDir "$GITHUB_WORKSPACE/_site/app" --emptyOutDir
          cp docs/demo/omniweave-demo.omw "$GITHUB_WORKSPACE/_site/app/demo.omw"
      - name: Build the test web app into /app-beta (this commit)
        env:
          OMW_WEB: "1"
        run: |
          node scripts/copy-pdfjs-assets.mjs
          npx vite build --outDir _site/app-beta --emptyOutDir
          cp docs/demo/omniweave-demo.omw _site/app-beta/demo.omw
          # its own name on the home screen next to the release app (the manifest id and scope are already its own path)
          node -e 'const f="_site/app-beta/manifest.webmanifest",fs=require("fs"),m=JSON.parse(fs.readFileSync(f,"utf8"));m.name="Omniweave Beta";m.short_name="Omniweave β";fs.writeFileSync(f,JSON.stringify(m,null,2))'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # deploy in its own job (GitHub's standard layout): the artifact is complete before deploy-pages looks it up
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
